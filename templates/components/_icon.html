{% comment %}
Icon set — every icon in the app comes from here so stroke weight and grid stay consistent.

Params:
  name  chevron | check | alert | info | copy | refresh | bars | circle | filter
  size  px, default 16
Usage:
  {% include "components/_icon.html" with name="check" size=14 %}
{% endcomment %}
<svg width="{{ size|default:16 }}" height="{{ size|default:16 }}" viewBox="0 0 24 24"
     fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {% if name == "chevron" %}<path d="M9 6l6 6-6 6"/>
  {% elif name == "check" %}<path d="M20 6L9 17l-5-5"/>
  {% elif name == "alert" %}<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>
  {% elif name == "info" %}<circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/>
  {% elif name == "copy" %}<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/>
  {% elif name == "refresh" %}<path d="M21 12a9 9 0 11-3-6.7M21 3v6h-6"/>
  {% elif name == "bars" %}<path d="M4 20V11M10 20V4M16 20v-6M22 20H2"/>
  {% elif name == "circle" %}<circle cx="12" cy="12" r="9"/>
  {% elif name == "filter" %}<path d="M3 5h18M7 12h10M11 19h2"/>
  {% endif %}
</svg>
