x-app: &app
  build: .
  restart: unless-stopped
  env_file: .env
  environment:
    # Inside the compose network the services answer on their own names and
    # default ports, so the host-facing URLs in .env do not apply here.
    DATABASE_URL: postgres://linkedin_optimizer:linkedin_optimizer@db:5432/linkedin_optimizer
    CELERY_BROKER_URL: redis://redis:6379/0
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: linkedin_optimizer
      POSTGRES_USER: linkedin_optimizer
      POSTGRES_PASSWORD: linkedin_optimizer
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkedin_optimizer"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    <<: *app
    # uvicorn rather than runserver: the onboarding stream is an async view, and
    # runserver is WSGI, where each open stream would pin a worker thread.
    command: >
      sh -c "python manage.py migrate --noinput &&
             uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "${WEB_PORT:-8000}:8000"

  worker:
    <<: *app
    command: celery -A config worker -l info -Q knowledge,default
    # The web service owns migrations; the worker only needs the schema to
    # already be there when it starts consuming.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  db_data:
